name: Android

on:
  push:
    # Path filters don't apply to tag pushes, so without this every release
    # tag would run this workflow too.
    branches:
      - "**"
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      record_screenshots:
        description: "Re-record the reference screenshots and commit them (after an intended UI change)"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Only used to commit recorded reference screenshots (see below).
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Java 21: Robolectric runs SDK 35 and later only on Java 21. The app
      # itself still compiles to Java 17 bytecode.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # The runner image ships the Android SDK, with ANDROID_HOME set and the
      # licenses accepted. The Android Gradle plugin downloads any missing
      # platform or build tools from there.
      - name: Check Android SDK
        run: test -d "$ANDROID_HOME" && echo "ANDROID_HOME=$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check formatting
        run: ./gradlew --no-daemon spotlessCheck

      - name: Lint
        run: ./gradlew --no-daemon lint

      # Screenshots are checked against the references in
      # app/src/test/screenshots. They are recorded and committed instead when
      # there are none yet, or when a manual run asks for it, never on a pull
      # request.
      - name: Decide screenshot mode
        id: shots
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && \
             { [ "${{ inputs.record_screenshots }}" = "true" ] || ! ls app/src/test/screenshots/*.png >/dev/null 2>&1; }; then
            echo "mode=record" >> "$GITHUB_OUTPUT"
          else
            echo "mode=verify" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify screenshots
        if: steps.shots.outputs.mode == 'verify'
        run: ./gradlew --no-daemon verifyRoborazziDebug

      - name: Record screenshots
        if: steps.shots.outputs.mode == 'record'
        run: ./gradlew --no-daemon recordRoborazziDebug

      - name: Commit recorded screenshots
        if: steps.shots.outputs.mode == 'record'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "Record reference screenshots"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # After the screenshot tasks, as Now in Android does, so the plain test
      # run isn't wrongly treated as up to date.
      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # The release build runs R8, which fails on missing keep rules; it is
      # unsigned, so only built, not uploaded.
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      # Room writes the database schema to app/schemas when it compiles. A
      # change must be committed by hand, with the database version raised and
      # a migration added: a changed schema under the same version crashes
      # the app on phones that have the old database.
      - name: Check Room schemas
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git status --porcelain app/schemas
            git diff app/schemas
            echo "::error::The Room schema changed. Raise the version in ChatDatabase, add a migration, and commit app/schemas."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: |
            android/app/src/test/screenshots/
            android/app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/core/build/reports/
          if-no-files-found: ignore
